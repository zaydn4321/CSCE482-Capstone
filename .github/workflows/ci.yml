name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:                      # cancel superseded runs — saves metered minutes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · typecheck, unit tests, expo-doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # expo-env.d.ts is gitignored and only generated by `expo start`,
      # so a fresh CI checkout has no CSS-module types. Without this, tsc fails.
      - name: Ensure Expo env types
        run: '[ -f expo-env.d.ts ] || echo "/// <reference types=\"expo/types\" />" > expo-env.d.ts'

      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor

  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
